<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <meta name="theme-color" content="#fbfbfd" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora</title>
    <script>
      // Set the theme before the first paint, so dark mode never flashes white while
      // the app loads. Mirrors src/theme/theme.ts (key 'aurora.theme'; no choice yet = follow the OS).
      ;(function () {
        var pref = null
        try {
          pref = localStorage.getItem('aurora.theme')
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
