name: Live demo

on:
  push:
    branches: [main]
    paths: [player/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: player/package-lock.json
      - run: npm ci
      - run: npx vite build --config vite.demo.config.ts
      - run: mv dist-demo/demo.html dist-demo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: player/dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4
